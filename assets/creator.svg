<?xml version="1.0" encoding="utf-8"?>
<!-- Simple vectorized creator icon derived from the provided artwork -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- tilted ellipse (hat) -->
  <g transform="translate(256,120) rotate(-12)">
    <ellipse cx="0" cy="0" rx="170" ry="36" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- legs/triangle A shape -->
  <path d="M150 220 L230 360 L280 360 L200 220 Z" fill="none" stroke="#000" stroke-width="10" stroke-linejoin="round"/>
  <path d="M330 230 L260 360" stroke="#000" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- diagonal bar -->
  <path d="M130 270 L380 330" stroke="#000" stroke-width="10" stroke-linecap="round"/>
  <!-- red horizontal line over the A -->
  <line x1="140" y1="230" x2="380" y2="230" stroke="#e53935" stroke-width="8" stroke-linecap="round"/>

  <!-- Creator text (uses fallback sans-serif) -->
  <g transform="translate(256,430)">
    <text x="0" y="0" font-family="'Yu Gothic', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="34" fill="#111" text-anchor="middle">Creator: あじふらい</text>
  </g>
</svg>
